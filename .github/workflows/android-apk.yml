name: Belicia Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/belicia-android-*"
    paths:
      - ".github/workflows/android-apk.yml"
      - "capacitor.config.ts"
      - "package.json"
      - "src/**"
      - "public/**"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Belicia
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # v4 no longer installs the deprecated Android SDK "tools" package.
      - name: Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # npm install updates the older web-only lockfile to include Capacitor.
      # Commit the refreshed package-lock.json after local npm install.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build bundled web app
        run: npm run build

      - name: Generate native Android shell
        run: npx cap add android

      - name: Sync compiled assets to Android
        run: npx cap sync android

      - name: Compile installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: belicia-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
